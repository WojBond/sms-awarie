# In httpd.conf enable proxy_module and proxy_http_module, then Include this file.
Listen 127.0.0.1:8090
<VirtualHost 127.0.0.1:8090>
    ServerName localhost
    ProxyRequests Off
    ProxyPass /sms-api !
    Alias /sms-api "C:/SMS-Awarie-Web/php/api.php"
    <Directory "C:/SMS-Awarie-Web/php">
        Require all denied
        <Files "api.php">
            Require local
        </Files>
    </Directory>
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
