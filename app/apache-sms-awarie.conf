# SMS-Awarie 4.x - panel w Apache z XAMPP. Dolaczany do httpd.conf przez scripts\install.ps1:
#   Include "C:/SMS-Awarie/apache-sms-awarie.conf"
# Panel: http://<serwer>/sms-awarie/  Na zewnatrz widoczny jest tylko katalog public.
Alias /sms-awarie "C:/SMS-Awarie/public"
<Directory "C:/SMS-Awarie/public">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
<Directory "C:/SMS-Awarie">
    Require all denied
</Directory>
